<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <div>
        <h2>Form Input Data</h2>
        <form>
            <label for="">Nama : </label>
            <input type="text" id="nama">
            <br><br>
            <label for="">No Hp : </label>
            <input type="text" id="nohp">
            <br><br>
            <label for="">Jenis Kelamin : </label>
            <input type="radio" name="jeniskelamin" id="pria" ><label for="pria">Pria</label>
            <input type="radio" name="jeniskelamin" id="wanita"><label for="wanita">Wanita</label>
            <br><br>
            <label for="">Hobby : </label>
            <input type="checkbox" name="mancing" id="mancing"><label for="mancing">Mancing</label>
            <input type="checkbox" name="bulutangkis" id="bulutangkis"><label for="bulutangkis">Bulutangkis</label>
            <input type="checkbox" name="jalan" id="jalan"><label for="jalan">Jalan-jalan</label>
            <input type="checkbox" name="musik" id="musik"><label for="musik">Musik</label>
            <br><br>
            <label for="">Pendidikan Terakhir : </label>
            <select name="lulusan" id="lulusan">
                <option value="sma">SMA/SMK</option>
                <option value="d3">D3</option>
                <option value="s1">S1</option>
                <option value="s2">S2</option>
                <option value="s3">S3</option>
            </select>
            <br><br><br>
            <button> Kirim </button>
        </form>
    </div>
    <h3><a href="index.html">Kembali</a></h3>
</body>
</html>
