<!DOCTYPE html>
<html>
<head>
    <title>Account Management</title>
</head>
<body>
    <table border="1" width="100%" cellpadding="10">
        <tr>
            <!-- Bagian Kiri -->
            <td width="30%" valign="top">
                <h3>Account Management</h3>
                <table>
                    <tr>
                        <td align="center">
                            <img src="AdnanGhaziRaushanNoor(2).jpg" alt="Profile Photo" width="150" height="180"><br><br>
                            <button>Upload Photo</button>
                        </td>
                    </tr>
                </table>
                <br>
                <form>
                    <label>Old Password</label><br>
                    <input type="password"><br><br>

                    <label>New Password</label><br>
                    <input type="password"><br><br>

                    <button>Change Password</button>
                </form>
            </td>

            <!-- Bagian Kanan -->
            <td width="70%" valign="top">
                <h3>Profile Information</h3>
                <table>
                    <tr>
                        <td>Username</td>
                        <td><input type="text" ></td>
                        <td>First Name</td>
                        <td><input type="text" ></td>
                    </tr>
                    <tr>
                        <td>Nickname</td>
                        <td><input type="text" ></td>
                        <td>Role</td>
                        <td>
                            <select>
                                <option selected>Subscriber</option>
                                <option>Admin</option>
                                <option>Editor</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Last Name</td>
                        <td><input type="text" ></td>
                        <td>Display Name Publicly as</td>
                        <td><input type="text" ></td>
                    </tr>
                </table>

                <h3>Contact Info</h3>
                <table>
                    <tr>
                        <td>Email (required)</td>
                        <td><input type="email" ></td>
                        <td>WhatsApp</td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Website</td>
                        <td><input type="text" ></td>
                        <td>Telegram</td>
                        <td><input type="text"></td>
                    </tr>
                </table>

                <h3>About the User</h3>
                <label>Biographical Info</label><br>
                <textarea rows="4" cols="100">
I am Adnan Ghazi, a vocational school graduate majoring in software engineering
                </textarea>
            </td>
        </tr>
    </table>
</body>
</html>
